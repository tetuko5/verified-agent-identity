name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent Name'
        required: true
        default: 'tetuko'
      agent_description:
        description: 'Agent Description'
        required: true
        default: 'tetuko AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ClawHub Verified Agent Skill
        run: |
          npm install -g clawhub
          npx clawhub install verified-agent-identity

      - name: Install Dependencies
        run: |
          cd scripts
          npm install

      - name: Generate Ethereum Identity
        run: |
          node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent Identity
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge '{"name":"${{ github.event.inputs.agent_name }}","description":"${{ github.event.inputs.agent_description }}"}'

      - name: Verification Complete
        run: echo "Agent Identity Successfully Verified"
